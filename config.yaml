market_data:
  provider: deriv
  instrument: frxXAUUSD
  dxy_proxy_instrument: frxEURUSD
  primary_granularity: M15
  higher_granularities: [H1, H4]
  candles_lookback: 240
  stale_after_minutes: 20

runtime:
  mode: research_only

deriv:
  app_id: 1089
  websocket_url: wss://ws.derivws.com/websockets/v3

training_data:
  provider: twelve_data
  symbol: XAU/USD
  dxy_symbol: DXY
  dxy_proxy_symbol: EUR/USD
  interval: 15min
  years: 5
  output: data/xauusd_m15.csv
  timezone: UTC
  chunk_days: 30

oanda:
  account_type: practice
  instrument: XAU_USD
  dxy_proxy_instrument: EUR_USD

database:
  path: data/xauusd.db

model:
  path: models/sell_meta_macro_xgb.pkl
  retrain_interval_weeks: 8

macro_data:
  dxy_path: data/training/dxy_m15.csv
  us10y_path: data/training/us10y_daily.csv

llm:
  provider: groq
  model: llama-3.3-70b-versatile
  temperature: 0
  timeout_seconds: 30

risk:
  min_confidence: 55
  min_rr_ratio: 1.5
  atr_sl_multiplier: 1.5
  atr_tp_multiplier: 2.25
  news_blackout_hours_before: 2
  news_blackout_minutes_after: 30
  session_cooldown_minutes: 30
  daily_drawdown_limit_r: 3
  suppress_asian_session: true
  asian_h4_strength_min: 0.8

sentiment:
  lookback_hours: 6
  feeds:
    - https://www.fxstreet.com/rss/news
  positive_words: [rally, surge, demand, safe-haven, haven, climbs, rises, bullish, rebound]
  negative_words: [drop, pressure, selloff, falls, bearish, slips, weakens]

calendar:
  provider: fxmacrodata
  manual_events_csv: data/news_blackouts.csv
  cache_csv: data/calendar_cache.csv
  weeks: 2
  lookahead_days: 7
  timeout_seconds: 15
  high_impact_keywords: [NFP, FOMC, CPI, PPI, PCE, GDP, Retail Sales, Unemployment Rate, Fed Chair, Rate Decision, Nonfarm Payrolls, Non-Farm Payrolls]

discord:
  min_confidence_to_notify: 55

logging:
  level: INFO
  file: logs/system.log

research:
  embargo_candles: 16
  calibration_fraction: 0.15
  max_calibration_fraction: 0.30
  min_calibration_trades: 40
  reliability_bins: 5
  min_reliability_bin_count: 15
  min_feature_rank_spearman: 0.50

execution:
  entry_delay_candles: 1
  max_spread_multiplier: 1.5
  news_blackout_candles_before: 2
  news_blackout_candles_after: 2
  news_events_csv: data/research/usd_high_impact_events.csv
  spread_by_session:
    Asian: 0.60
    London: 0.35
    New York: 0.35
    London/NY Overlap: 0.30
